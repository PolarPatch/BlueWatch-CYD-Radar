; BlueWatch display: shows the BlueWatch device list on an ESP32-3248S035C
; (3.5" 320x480 ST7796 with GT911 capacitive touch), portrait.
[env:bluewatch-display]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
; PlatformIO auto-detects the serial port on most systems. If it picks the
; wrong one (or you have several boards plugged in), uncomment and edit:
; upload_port = /dev/cu.usbserial-XXXX
; monitor_port = /dev/cu.usbserial-XXXX
board_build.partitions = huge_app.csv
lib_deps =
    lovyan03/LovyanGFX@^1.1.16
    bblanchon/ArduinoJson@^7.0.4
build_flags = -DCORE_DEBUG_LEVEL=0
