; BlueWatch CYD Radar -- two board targets. Both run the same firmware:
; a scrollable device list, long-press device details, and a live radar,
; fetched from a BlueWatch server when one is reachable, or from the
; board's own standalone BLE scan otherwise (see README).
;
; Build/upload a specific board with `pio run -e <name> -t upload`; plain
; `pio run` builds the default (main) board below.
[platformio]
default_envs = cyd-2432s028

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
; PlatformIO auto-detects the serial port on most systems. If it picks the
; wrong one (or you have several boards plugged in), uncomment and edit:
; upload_port = /dev/cu.usbserial-XXXX
; monitor_port = /dev/cu.usbserial-XXXX
board_build.partitions = huge_app.csv
lib_deps =
    lovyan03/LovyanGFX@^1.1.16
    bblanchon/ArduinoJson@^7.0.4
    h2zero/NimBLE-Arduino@^1.4.3
build_flags = -DCORE_DEBUG_LEVEL=0

; Main board: ESP32-2432S028 ("Cheap Yellow Display"), 2.8" 320x240
; portrait, ST7789 + XPT2046 resistive touch. The more common/cheaper
; of the two, and the one meant to work out of the box.
[env:cyd-2432s028]
build_flags = ${env.build_flags} -DBOARD_CYD_2432S028

; Secondary board: ESP32-3248S035C, 3.5" 320x480 portrait, ST7796 + GT911
; capacitive touch. Supported, kept working, not the primary target.
[env:cyd-3248s035c]
build_flags = ${env.build_flags} -DBOARD_CYD_3248S035C

; Test builds: force standalone mode (own BLE scan only, no Wi-Fi/BlueWatch
; at all) regardless of config.h, to check standalone mode on real hardware
; without touching the real Wi-Fi/server settings. Not meant to stay flashed
; long-term -- reflash the normal env above when done testing.
[env:cyd-2432s028-standalone-test]
build_flags = ${env.build_flags} -DBOARD_CYD_2432S028 -DFORCE_STANDALONE

[env:cyd-3248s035c-standalone-test]
build_flags = ${env.build_flags} -DBOARD_CYD_3248S035C -DFORCE_STANDALONE

; Demo builds: every device name becomes a generic placeholder (same pool as
; the web dashboard's own ?demo=1) and Device Details' address is zeroed --
; same devices keep the same fake name, so it's safe for screenshots/photos.
; Not meant to stay flashed long-term.
[env:cyd-2432s028-demo]
build_flags = ${env.build_flags} -DBOARD_CYD_2432S028 -DDEMO_MODE

[env:cyd-3248s035c-demo]
build_flags = ${env.build_flags} -DBOARD_CYD_3248S035C -DDEMO_MODE
